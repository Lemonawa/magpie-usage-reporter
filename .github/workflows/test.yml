name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  magpie-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: bun test test/*.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: ccbbcbffcba0507ee3536bf63e5fb56a12e7d5a9
          path: .upstream-magpie
          persist-credentials: false
      - run: python3 test/host.integration.py bun .upstream-magpie/internal/plugin/host.js
      - run: python3 test/host.integration.py bun .upstream-magpie/internal/plugin/host.js github:example/magpie-usage-reporter
